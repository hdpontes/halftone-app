services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: halftone-backend-dev
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - PORT=3001
      - FRONTEND_URL=http://localhost:3000
    ports:
      - "3001:3001"
    volumes:
      - ./backend/src:/app/src
    networks:
      - halftone-dev

  frontend:
    image: node:20-alpine
    container_name: halftone-frontend-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    environment:
      - VITE_API_URL=http://localhost:3001/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - halftone-dev

networks:
  halftone-dev:
    driver: bridge
