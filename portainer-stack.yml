# ============================================================
# Portainer Stack — HalftonePro DTF Studio
# Com Cloudflare Tunnel — sem exposição de portas externas
# ============================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: halftone-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - FRONTEND_URL=${FRONTEND_URL:-http://halftone-frontend}
    # Sem ports — acesso só pela rede interna Docker
    networks:
      - halftone-net
      - ${TUNNEL_NETWORK:-cloudflare-tunnel}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: halftone-frontend
    restart: unless-stopped
    # Sem ports — o tunnel aponta direto para halftone-frontend:80
    networks:
      - halftone-net
      - ${TUNNEL_NETWORK:-cloudflare-tunnel}
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

networks:
  halftone-net:
    driver: bridge
    name: halftone-network

  # Rede externa onde o cloudflared já está rodando
  # Troque o nome se a sua rede tiver outro nome
  cloudflare-tunnel:
    external: true
    name: ${TUNNEL_NETWORK:-cloudflare-tunnel}
