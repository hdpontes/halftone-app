# ============================================================
# Portainer Stack — HalftonePro DTF Studio
# ============================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: halftone-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - FRONTEND_URL=${FRONTEND_URL:-http://halftone-frontend}
    networks:
      - halftone-net
      - tunnel
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: halftone-frontend
    restart: unless-stopped
    networks:
      - halftone-net
      - tunnel
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

networks:
  halftone-net:
    driver: bridge
    name: halftone-network

  tunnel:
    external: true
    name: automacoes_default
